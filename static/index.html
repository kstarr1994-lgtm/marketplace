<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Radar</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:24px}header{margin-bottom:18px}h1{margin:0;font-size:30px}.sub{color:#68717b;margin-top:5px}.panel{background:white;border:1px solid #e1e4e8;border-radius:16px;padding:18px;box-shadow:0 2px 10px #00000008;margin-bottom:16px}.controls{display:grid;grid-template-columns:2fr 1fr auto;gap:12px}label{font-size:12px;font-weight:700;color:#5c6570;display:block;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #ccd2d8;border-radius:10px;font:inherit}button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:#111827;color:white;font-weight:700;cursor:pointer}button.secondary{background:#eef0f3;color:#111827}.terms{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.term{display:flex;align-items:center;gap:7px;border:1px solid #dfe3e8;padding:8px 10px;border-radius:10px;background:#fafbfc;font-size:14px}.term input{width:auto}.term button{padding:2px 6px;background:transparent;color:#8a3030;font-size:16px}.add{display:flex;gap:8px;margin-top:12px}.add input{max-width:420px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{margin:12px 0;color:#59636e;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:white;border:1px solid #e1e4e8;border-radius:14px;overflow:hidden}.pic{height:180px;background:#eef0f2;display:flex;align-items:center;justify-content:center;color:#8a929b}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.title{font-weight:750;line-height:1.25}.price{font-size:18px;font-weight:800;margin-top:9px}.meta{font-size:13px;color:#69737d;margin-top:8px}.card a{display:block;margin-top:12px;text-decoration:none;color:#111827;font-weight:700}.err{background:#fff7e8;border:1px solid #f1d49b;color:#77540b;padding:12px;border-radius:10px;margin-bottom:8px}@media(max-width:700px){.controls{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><header><h1>Marketplace Radar</h1><div class="sub">Your saved searches, all in one feed.</div></header><section class="panel"><label>SEARCH TERMS</label><div id="terms" class="terms"></div><div class="add"><input id="newTerm" placeholder="Add a search term…"><button onclick="addTerm()">Add term</button></div><div class="actions"><button class="secondary" onclick="selectAll(true)">Select all</button><button class="secondary" onclick="selectAll(false)">Deselect all</button><button onclick="saveTerms()">Save search terms</button></div></section><section class="panel"><div class="controls"><div><label>RADIUS (KM)</label><input id="radius" type="number" value="20" min="1" max="100"></div><div><label>LOCATION / POSTCODE</label><input id="postcode" placeholder="Optional postcode"></div><div style="align-self:end"><button onclick="run()">Search nearby</button></div></div><div class="status" id="status">Your terms are saved in this browser. Choose terms and search.</div><div id="errors"></div></section><div id="results" class="grid"></div></div><script>const defaults=["herringbone LVT","porcelain tiles","oak flooring","kitchen cabinets","bathroom vanity","radiators","internal doors","antique brass taps","lighting","sinks","wallpaper","paint","skirting boards","architrave","wood flooring","garden furniture","greenhouse","roof windows"];let terms=JSON.parse(localStorage.getItem("mr_terms")||"null")||defaults.map(x=>({text:x,on:true}));function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function renderTerms(){document.getElementById("terms").innerHTML=terms.map((t,i)=>`<label class="term"><input type="checkbox" ${t.on?"checked":""} onchange="terms[${i}].on=this.checked"> ${esc(t.text)} <button title="Delete" onclick="terms.splice(${i},1);renderTerms()">×</button></label>`).join("")}function addTerm(){let x=document.getElementById("newTerm").value.trim();if(!x)return;if(!terms.some(t=>t.text.toLowerCase()==x.toLowerCase()))terms.push({text:x,on:true});document.getElementById("newTerm").value="";renderTerms()}function selectAll(v){terms.forEach(t=>t.on=v);renderTerms()}function saveTerms(){localStorage.setItem("mr_terms",JSON.stringify(terms));document.getElementById("status").textContent="Saved. Your search terms will remain on this device."}async function loc(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:true,timeout:12000}))}function card(x){let img=x.image?`<img src="${esc(x.image)}">`:"No image";let price=x.price!=null?`£${Number(x.price).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`:"";let d=x.posted?new Date(x.posted).toLocaleString():"Date not supplied";return `<article class="card"><div class="pic">${img}</div><div class="body"><div class="title">${esc(x.title)}</div><div class="price">${price}</div><div class="meta">${esc(x.source)} · ${esc(x.location||"Local listing")} · ${esc(d)}</div><a href="${esc(x.url)}" target="_blank" rel="noopener">Open listing →</a></div></article>`}async function run(){let chosen=terms.filter(t=>t.on).map(t=>t.text);if(!chosen.length){document.getElementById("status").textContent="Select at least one search term.";return}document.getElementById("status").textContent="Getting your location…";let c;try{c=await loc()}catch(e){document.getElementById("status").textContent="Please allow location access.";return}document.getElementById("status").textContent="Searching eBay, Gumtree and Facebook Marketplace…";document.getElementById("errors").innerHTML="";document.getElementById("results").innerHTML="";let q=new URLSearchParams({keywords:chosen.join(","),radius:document.getElementById("radius").value,lat:c.latitude,lon:c.longitude,postcode:document.getElementById("postcode").value});try{let r=await fetch("/api/search?"+q),d=await r.json();document.getElementById("status").textContent=`${d.items.length} results · newest first · ${d.radius_km} km`;document.getElementById("errors").innerHTML=d.errors.map(e=>`<div class="err">${esc(e)}</div>`).join("");document.getElementById("results").innerHTML=d.items.map(card).join("")||"<div class='panel'>No listings found.</div>"}catch(e){document.getElementById("status").textContent="Search failed: "+e.message}}renderTerms();</script></body></html>
